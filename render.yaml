# Render Blueprint — free web service (Docker) for knowledge-atlas.
# Pair with a free Neon Postgres; set DATABASE_URL + GITHUB_WEBHOOK_SECRET in the dashboard.
services:
  - type: web
    name: knowledge-atlas
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false                 # paste the Neon connection string in the dashboard
      - key: API_KEY
        generateValue: true         # Render generates a secret; copy it for write calls
      - key: GITHUB_WEBHOOK_SECRET
        sync: false                 # set to match the GitHub webhook secret
      - key: EMBEDDINGS_ENABLED
        sync: false                 # set "true" + GEMINI_API_KEY in dashboard for cloud embeddings
      - key: GEMINI_API_KEY
        sync: false                 # optional Gemini API key for 384d embeddings without PyTorch
      - key: PRIVATE_MODE
        sync: false                 # set "true" + GitHub OAuth vars in dashboard to lock down cloud access
      - key: SESSION_SECRET
        generateValue: true         # HMAC key for signed session cookies in private mode
      - key: GITHUB_CLIENT_ID
        sync: false                 # GitHub OAuth / GitHub App client ID
      - key: GITHUB_CLIENT_SECRET
        sync: false                 # GitHub OAuth / GitHub App client secret
      - key: ALLOWED_GITHUB_LOGIN
        sync: false                 # single GitHub username allowed when PRIVATE_MODE=true
      - key: AUTO_INIT_DB
        value: "true"               # create/update schema on boot
