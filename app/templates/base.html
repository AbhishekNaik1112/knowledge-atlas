<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Knowledge Atlas{% endblock %}</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("ka-theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (_) {}
    })();
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root {
      --bg: #fafaf9;
      --surface: #ffffff;
      --surface-subtle: #f5f5f4;
      --border: #e7e5e4;
      --text: #1c1917;
      --muted: #57534e;
      --accent: #0f766e;
      --accent-soft: #f0fdfa;
      --code-bg: #f5f5f4;
      --ok-bg: #dcfce7;
      --ok-fg: #166534;
      --warn-bg: #fef3c7;
      --warn-fg: #92400e;
      --err-bg: #fee2e2;
      --err-fg: #991b1b;
      --shadow: 0 1px 2px rgba(28, 25, 23, .05);
      --radius: 8px;
    }
    [data-theme="dark"] {
      --bg: #0c0a09;
      --surface: #171514;
      --surface-subtle: #1f1d1b;
      --border: #292524;
      --text: #fafaf9;
      --muted: #a8a29e;
      --accent: #2dd4bf;
      --accent-soft: rgba(45, 212, 191, .14);
      --code-bg: #262320;
      --ok-bg: rgba(34, 197, 94, .18);
      --ok-fg: #86efac;
      --warn-bg: rgba(245, 158, 11, .18);
      --warn-fg: #fcd34d;
      --err-bg: rgba(239, 68, 68, .18);
      --err-fg: #fca5a5;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--accent);
      color: #fff;
      padding: .5rem 1rem;
      z-index: 50;
      border-radius: 0 0 6px 0;
      font-weight: 600;
      text-decoration: none;
    }
    .skip-link:focus { left: 0; }
    header.topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(8px);
    }
    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: .65rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
    }
    .brand {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -.01em;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }
    nav.nav-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .25rem;
    }
    nav.nav-links a,
    .nav-btn {
      color: var(--muted);
      text-decoration: none;
      font-size: .875rem;
      font-weight: 500;
      padding: .35rem .7rem;
      border-radius: 6px;
      border: 0;
      background: none;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, color .15s;
    }
    nav.nav-links a:hover,
    .nav-btn:hover {
      background: var(--surface-subtle);
      color: var(--text);
    }
    nav.nav-links a.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    main {
      max-width: 1120px;
      margin: 1.75rem auto 3rem;
      padding: 0 1.25rem;
    }
    a { color: var(--accent); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: .42rem .85rem;
      border-radius: 6px;
      font-size: .86rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      transition: border-color .15s, color .15s, background .15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    [data-theme="dark"] .btn-primary { color: #0c0a09; }
    .btn-primary:hover { opacity: .92; color: #ffffff; }
    [data-theme="dark"] .btn-primary:hover { color: #0c0a09; }
    .badge {
      display: inline-block;
      font-size: .75rem;
      font-weight: 600;
      padding: .15rem .55rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      text-transform: lowercase;
    }
    .badge-ok { background: var(--ok-bg); color: var(--ok-fg); }
    .badge-warn { background: var(--warn-bg); color: var(--warn-fg); }
    .badge-err { background: var(--err-bg); color: var(--err-fg); }
    .badge-neutral { background: var(--surface-subtle); color: var(--muted); }
    .badge.architecture-guide { background: var(--accent-soft); color: var(--accent); }
    .badge.security-note { background: var(--err-bg); color: var(--err-fg); }
    .badge.technical-note { background: #e0f2fe; color: #0369a1; }
    [data-theme="dark"] .badge.technical-note { background: rgba(56, 189, 248, .18); color: #7dd3fc; }
    .badge.pattern { background: var(--ok-bg); color: var(--ok-fg); }
    .badge.reference { background: var(--warn-bg); color: var(--warn-fg); }
    .tag {
      display: inline-block;
      background: var(--code-bg);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: .08rem .45rem;
      font-size: .76rem;
      font-weight: 500;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .87em;
      background: var(--code-bg);
      padding: .12rem .35rem;
      border-radius: 4px;
    }
    pre {
      background: #1c1917;
      color: #f5f5f4;
      padding: .95rem 1.05rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow-x: auto;
      font-size: .87rem;
    }
    pre code { background: transparent; padding: 0; color: inherit; }
    mark { background: #fef08a; color: #1c1917; padding: 0 .15rem; border-radius: 3px; }
    small, .muted { color: var(--muted); }
    table { border-collapse: collapse; width: 100%; }
    td, th { border-bottom: 1px solid var(--border); padding: .6rem .75rem; text-align: left; }
    th {
      background: var(--surface-subtle);
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
    }
    {% block extra_head %}{% endblock %}
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/ui"><span class="brand-dot" aria-hidden="true"></span>Knowledge Atlas</a>
      {% set p = request.url.path if request is defined else '' %}
      <nav class="nav-links" aria-label="Primary">
        <a href="/ui" class="{% if p == '/ui' or p.startswith('/ui/concepts') %}active{% endif %}">Catalog</a>
        <a href="/ui/graph" class="{% if p == '/ui/graph' %}active{% endif %}">Graph</a>
        <a href="/ui/activity" class="{% if p == '/ui/activity' %}active{% endif %}">Activity</a>
        <a href="/export.zip">Export</a>
        <a href="/docs" class="{% if p == '/docs' %}active{% endif %}">API Docs</a>
        <button id="theme-toggle" class="nav-btn" type="button" aria-label="Toggle color theme" title="Toggle light/dark theme">Theme</button>
        {% if request is defined and request.cookies.get('ka_session') %}
        <form method="post" action="/auth/logout" style="display:inline; margin:0;">
          <button type="submit" class="nav-btn">Sign out</button>
        </form>
        {% endif %}
      </nav>
    </div>
  </header>
  <main id="main-content">{% block content %}{% endblock %}</main>
  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      if (!btn) return;
      function syncLabel() {
        var dark = document.documentElement.dataset.theme === "dark";
        btn.textContent = dark ? "Light" : "Dark";
      }
      syncLabel();
      btn.addEventListener("click", function () {
        var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("ka-theme", next); } catch (_) {}
        syncLabel();
        window.dispatchEvent(new CustomEvent("ka-theme-change", { detail: { theme: next } }));
      });
    })();
  </script>
</body>
</html>
