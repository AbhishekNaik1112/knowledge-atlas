<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Knowledge Atlas{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --code-bg: #f1f5f9;
      --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 1px 2px rgba(15, 23, 42, .04);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header.topbar {
      background: #0f172a;
      color: #f8fafc;
      border-bottom: 1px solid #1e293b;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: .75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff;
      text-decoration: none;
      letter-spacing: -.01em;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #818cf8;
      display: inline-block;
    }
    nav.nav-links { display: flex; gap: .5rem; }
    nav.nav-links a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: .9rem;
      font-weight: 500;
      padding: .35rem .75rem;
      border-radius: 6px;
      transition: background .15s, color .15s;
    }
    nav.nav-links a:hover { background: #1e293b; color: #fff; }
    main {
      max-width: 1120px;
      margin: 1.75rem auto 3rem;
      padding: 0 1.25rem;
    }
    a { color: var(--accent); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }
    .badge {
      display: inline-block;
      font-size: .75rem;
      font-weight: 600;
      padding: .15rem .5rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      text-transform: lowercase;
    }
    .badge.architecture-guide { background: #ede9fe; color: #6d28d9; }
    .badge.security-note { background: #fee2e2; color: #b91c1c; }
    .badge.technical-note { background: #dbeafe; color: #1d4ed8; }
    .badge.pattern { background: #dcfce7; color: #15803d; }
    .badge.reference { background: #fef3c7; color: #b45309; }
    .tag {
      display: inline-block;
      background: var(--code-bg);
      color: #334155;
      border-radius: 5px;
      padding: .1rem .45rem;
      font-size: .78rem;
      font-weight: 500;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .88em;
      background: var(--code-bg);
      padding: .12rem .35rem;
      border-radius: 4px;
    }
    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: .9rem 1rem;
      border-radius: 8px;
      overflow-x: auto;
      font-size: .88rem;
    }
    pre code { background: transparent; padding: 0; color: inherit; }
    mark { background: #fef08a; color: #0f172a; padding: 0 .15rem; border-radius: 3px; }
    small, .muted { color: var(--muted); }
    table { border-collapse: collapse; width: 100%; }
    td, th { border: 1px solid var(--border); padding: .45rem .65rem; text-align: left; }
    th { background: var(--code-bg); }
    {% block extra_head %}{% endblock %}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/ui"><span class="brand-dot"></span>Knowledge Atlas</a>
      <nav class="nav-links">
        <a href="/ui">Catalog</a>
        <a href="/ui/graph">Graph</a>
        <a href="/ui/activity">Activity</a>
        <a href="/docs">API Docs</a>
      </nav>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
