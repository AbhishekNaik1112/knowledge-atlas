{% if sync_event.embed_status == 'ok' -%}
  <span class="badge badge-ok">ok ({{ sync_event.embedded_count }})</span>
{%- elif sync_event.embed_status == 'in_progress' -%}
  <span class="badge badge-warn">in progress</span>
{%- elif sync_event.embed_status == 'error' -%}
  <span class="badge badge-err">error</span>
{%- else -%}
  <span class="badge badge-neutral">{{ sync_event.embed_status }}</span>
{%- endif %}
